# Render Blueprint: one free web service that serves the React app and the API together.
# The database is NOT created here (Render's free database is deleted after 30 days);
# paste a Neon (or other) PostgreSQL connection string into DATABASE_URL when Render asks for it.
services:
  - type: web
    name: milco-fis
    runtime: node
    plan: free
    region: frankfurt      # closest Render region to Lesotho; pick the same region for the database
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/public
    envVars:
      - key: DATABASE_URL
        sync: false            # Render asks you to paste it when you create the service
      - key: TZ
        value: Africa/Maseru   # so "today" on the till is Lesotho's date
      - key: NODE_VERSION
        value: "22"
      - key: SAMPLE_TRANSACTIONS
        value: "true"
      - key: SHOW_DEMO_ACCOUNTS
        value: "true"
      - key: MPESA_MERCHANT_NUMBER
        value: "58847088"
      - key: ECOCASH_MERCHANT_NUMBER
        value: "62178072"
      - key: MPESA_API_ENABLED
        value: "false"
